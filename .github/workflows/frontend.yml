name: Frontend

on:
  pull_request:
  push:
    branches: [develop, staging, main, master]

permissions:
  contents: read

jobs:
  build-and-budget:
    name: Build, bundle budget, a11y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce bundle budget (250KB gzipped initial JS)
        run: node scripts/check-bundle-budget.mjs

      - name: Upload bundle composition report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-report
          path: dist/bundle-report.html
          retention-days: 30

      - name: Run Vitest (includes axe a11y assertions)
        run: npx vitest run

      - name: Docs link-check
        run: node scripts/check-doc-links.mjs --extra src/README.md

  e2e:
    name: E2E smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: npx playwright test

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
