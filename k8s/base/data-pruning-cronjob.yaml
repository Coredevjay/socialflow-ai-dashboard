apiVersion: batch/v1
kind: CronJob
metadata:
  name: socialflow-data-pruning
  labels:
    app.kubernetes.io/name: socialflow-data-pruning
    app.kubernetes.io/component: data-pruning
    app.kubernetes.io/part-of: socialflow
spec:
  # Retention schedule: run daily at 03:00 UTC.
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: socialflow-data-pruning
            app.kubernetes.io/component: data-pruning
            app.kubernetes.io/part-of: socialflow
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: data-pruning
              image: socialflow-backend:latest
              imagePullPolicy: IfNotPresent
              command:
                - node
                - dist/scripts/data-pruning.js
              envFrom:
                - configMapRef:
                    name: socialflow-config
                - secretRef:
                    name: socialflow-secrets
              env:
                - name: NODE_ENV
                  value: production
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: shared-data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: shared-data
              persistentVolumeClaim:
                claimName: socialflow-shared-data
            - name: tmp
              emptyDir: {}