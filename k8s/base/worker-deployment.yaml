apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialflow-worker
  labels:
    app: socialflow-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socialflow-worker
  template:
    metadata:
      labels:
        app: socialflow-worker
    spec:
      serviceAccountName: socialflow-backend
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: socialflow-worker:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: socialflow-config
            - secretRef:
                name: socialflow-secrets
          # Liveness fails if the event loop is blocked (deadlock);
          # readiness fails if a worker loses its Redis connection.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Allow BullMQ to finish in-flight jobs before the container stops
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
