apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialflow-backend
  labels:
    app: socialflow-backend
spec:
  selector:
    matchLabels:
      app: socialflow-backend
  template:
    metadata:
      labels:
        app: socialflow-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: socialflow-backend
      terminationGracePeriodSeconds: 300
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: socialflow-backend
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: socialflow-backend
                topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Read-only gate: fails if migrations are pending, so pods never serve a
        # schema mismatch. Migrations themselves run once via migration-job.yaml.
        - name: migrate-check
          image: socialflow-backend:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "status"]
          envFrom:
            - configMapRef:
                name: socialflow-config
            - secretRef:
                name: socialflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: backend
          image: socialflow-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: socialflow-config
            - secretRef:
                name: socialflow-secrets
          env:
            # Data pruning must NOT run in-process: the repeatable BullMQ job
            # would prune paths on whichever pod's ephemeral container
            # filesystem happened to pick it up, leaving files on other
            # replicas unpruned. Pruning runs instead via the dedicated
            # Kubernetes CronJob (k8s/base/data-pruning-cronjob.yaml), which
            # mounts the shared volume and prunes it once per schedule.
            - name: DATA_PRUNING_IN_PROCESS_ENABLED
              value: "false"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
